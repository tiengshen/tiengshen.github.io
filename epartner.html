<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>My ePartner</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1f2328; --muted: #656d76; --line: #e3e6ea;
    --accent: #1a5fb4; --accent-text: #ffffff; --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e;
    --chip: #eef1f5; --row-hover: #f3f6fb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --card: #171b21; --text: #e6e8eb; --muted: #9aa3ad; --line: #2a3038;
      --accent: #4c8ee6; --accent-text: #0b1220; --ok: #4ac26b; --warn: #d29922; --bad: #f85149;
      --chip: #222831; --row-hover: #1d232b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1400px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .bar label { color: var(--muted); font-size: 13px; }
  input, select, button { font: inherit; color: var(--text); }
  input[type=text], input[type=search], select { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  button { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .spacer { flex: 1; }
  #msg { padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; display: none; }
  #msg.show { display: block; }
  #msg.info { background: var(--chip); }
  #msg.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); }
  #msg.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .tile .k { color: var(--muted); font-size: 12px; }
  .tile .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tile.click { cursor: pointer; }
  .tile.click:hover, .tile.active { border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip { background: var(--chip); border: 1px solid transparent; border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
  .chip.active { border-color: var(--accent); color: var(--accent); }
  .tablewrap { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: auto; max-height: 70vh; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--card); cursor: pointer; user-select: none; font-weight: 600; z-index: 1; }
  th .arrow { color: var(--muted); font-size: 11px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:hover td { background: var(--row-hover); }
  .due-soon { color: var(--warn); font-weight: 600; }
  .overdue { color: var(--bad); font-weight: 600; }
  details.cols { position: relative; }
  details.cols > div { position: absolute; z-index: 5; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; max-height: 50vh; overflow: auto; min-width: 240px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
  details.cols label { display: block; color: var(--text); padding: 2px 0; }
  summary { cursor: pointer; list-style: none; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 10px; }
  #diag { white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: none; margin-top: 10px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 4px 0 14px; }
  .tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 9px 14px; color: var(--muted); font-weight: 600; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:hover { border-color: transparent; border-bottom-color: var(--line); }
  .tab.active:hover { border-bottom-color: var(--accent); }
  #dmsg { padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; display: none; }
  #dmsg.show { display: block; }
  #dmsg.info { background: var(--chip); }
  #dmsg.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); }
  #dmsg.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); }
  #ddiag { white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: none; margin-top: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .card h2 { font-size: 16px; margin: 0 0 8px; }
  .kv { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .kv b { color: var(--text); font-weight: 600; }
  td.block { color: var(--muted); }
  tr.group-start td { border-top: 2px solid var(--line); }
  .zero { color: var(--muted); }
  @media (max-width: 600px) { .bar { flex-direction: column; align-items: stretch; } .spacer { display: none; } }
</style>
</head>
<body>
<main>
  <h1>My ePartner</h1>
  <p class="sub">Pulled from ePartner by the ePartner Puller extension. Data stays in this browser only.</p>

  <div class="bar">
    <label for="agentNo">Agent no.</label>
    <input type="text" id="agentNo" size="10" inputmode="numeric" autocomplete="off">
    <label for="keep">Keep data</label>
    <select id="keep">
      <option value="local">until I click Clear</option>
      <option value="session">until I close this tab</option>
    </select>
    <span class="spacer"></span>
    <button id="btnClear">Clear all data</button>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="pol">Policies</button>
    <button class="tab" role="tab" data-tab="dcms">DCMS Production</button>
  </div>

  <section id="tab-pol">
    <p class="sub" id="sub"></p>
    <div class="bar">
      <button class="primary" id="btnUpdate">Update policies from ePartner</button>
      <span class="spacer"></span>
      <label class="import"><button id="btnImport" type="button">Import saved page…</button><input type="file" id="file" accept=".html,.htm,text/html" hidden></label>
    </div>
    <div id="msg"></div>
    <div id="content"></div>
    <div id="diag"></div>
  </section>

  <section id="tab-dcms" hidden>
    <p class="sub" id="dsub"></p>
    <div class="bar">
      <label for="dStart">Start period</label>
      <input type="date" id="dStart">
      <label for="dEnd">End period</label>
      <input type="date" id="dEnd">
      <label><input type="checkbox" id="dV1" checked> Dc Rep Contest</label>
      <label><input type="checkbox" id="dV2" checked> Dc Rep Maint &amp; Promotion Review</label>
      <button class="primary" id="btnDcms">Update DCMS</button>
    </div>
    <div id="dmsg"></div>
    <div id="dcontent"></div>
    <div id="ddiag"></div>
  </section>
</main>

<script>
(() => {
  // ---- Settings -----------------------------------------------------------
  const EXT_ID = 'hejafgddnndcimepblniaffimbgmedgk';
  const LIST_PATH = '/ePartner3_fpms/fpms/customerService/policyEnquiry.do';
  const DATA_KEY = 'ep.policies.v1';
  const DUE_SOON_DAYS = 30;
  // Columns hidden by default (you can still switch them on under "Columns").
  const DEFAULT_HIDDEN = [/gja/i, /issuing agent/i, /^column \d+$/i];

  // ---- Safe storage -------------------------------------------------------
  const store = {
    get(area, k) { try { return window[area].getItem(k); } catch { return null; } },
    set(area, k, v) { try { window[area].setItem(k, v); return true; } catch { return false; } },
    del(area, k) { try { window[area].removeItem(k); } catch {} },
  };
  const $ = id => document.getElementById(id);

  // ---- State --------------------------------------------------------------
  let data = null;            // { fetchedAt, source, headers, rows: [{ _policyNo, ...cells }] }
  let view = { q: '', status: '', due: '', sort: null, dir: 1, hidden: null };

  $('agentNo').value = store.get('localStorage', 'ep.agentNo') || '';
  $('keep').value = store.get('localStorage', 'ep.keep') || 'local';
  try { view.hidden = JSON.parse(store.get('localStorage', 'ep.hiddenCols') || 'null'); } catch {}

  // ---- UI events ----------------------------------------------------------
  $('agentNo').addEventListener('change', e => store.set('localStorage', 'ep.agentNo', e.target.value.trim()));
  $('keep').addEventListener('change', e => {
    store.set('localStorage', 'ep.keep', e.target.value);
    if (data) save();
  });
  $('btnUpdate').addEventListener('click', update);
  $('btnClear').addEventListener('click', () => {
    store.del('localStorage', DATA_KEY); store.del('sessionStorage', DATA_KEY);
    data = null; render(); flash('Data cleared from this browser.', 'ok');
  });
  $('btnImport').addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    try { ingest(await f.text(), 'Imported file: ' + f.name); }
    catch (err) { fail(err); }
  });

  // ---- Extension bridge ---------------------------------------------------
  function ext(msg) {
    return new Promise((resolve, reject) => {
      if (!window.chrome || !chrome.runtime || !chrome.runtime.sendMessage) {
        return reject(new Error('NO_EXTENSION'));
      }
      try {
        chrome.runtime.sendMessage(EXT_ID, msg, res => {
          const le = chrome.runtime.lastError;
          if (le) return reject(new Error('NO_EXTENSION'));
          resolve(res);
        });
      } catch { reject(new Error('NO_EXTENSION')); }
    });
  }

  const ERR_TEXT = {
    NO_EXTENSION: 'The ePartner Puller extension was not found. Use Chrome on the computer where it is installed, and check it is switched on in chrome://extensions.',
    NO_TAB: 'Open ePartner in another tab and log in, then click Update again.',
    LOGGED_OUT: 'Your ePartner session has expired. Log in to ePartner again, then click Update.',
    NETWORK: 'Could not reach ePartner. Check your internet connection and that the ePartner tab is loaded.',
  };

  async function update() {
    const agentNo = $('agentNo').value.trim();
    if (!/^\d{4,12}$/.test(agentNo)) { flash('Enter your agent number first.', 'bad'); $('agentNo').focus(); return; }
    store.set('localStorage', 'ep.agentNo', agentNo);
    const btn = $('btnUpdate'); btn.disabled = true;
    flash('Pulling your policy listing from ePartner…', 'info');
    try {
      const res = await ext({
        type: 'fetch', path: LIST_PATH, method: 'POST',
        form: { action: 'getPolicyEnquiry_Result', check: '0', optionSelection: 'All_policies', agentNo, submit: 'Submit' },
      });
      if (!res || !res.ok) throw new Error((res && res.error) || 'ERROR', { cause: res && res.detail });
      ingest(res.html, 'ePartner');
    } catch (err) { fail(err); }
    finally { btn.disabled = false; }
  }

  function fail(err) {
    const code = err && err.message;
    let text = ERR_TEXT[code] || (code && code.startsWith('HTTP_') ? 'ePartner returned an error (' + code.slice(5) + '). Try again in a moment.' : (code || 'Something went wrong.'));
    if (err && err.cause) text += ' (' + err.cause + ')';
    flash(text, 'bad');
  }

  // ---- Parsing ------------------------------------------------------------
  const norm = s => (s || '').replace(/\s+/g, ' ').trim();
  const cellsOf = tr => [...tr.children].filter(c => c.tagName === 'TD' || c.tagName === 'TH');

  function parsePolicyList(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    let headerTr = null;
    for (const tr of doc.querySelectorAll('tr')) {
      const t = cellsOf(tr).map(c => norm(c.textContent).toLowerCase());
      if (t.includes('status') && t.some(x => x.startsWith('commencement date'))) { headerTr = tr; break; }
    }
    if (!headerTr) throw new Error('PARSE: could not find the policy table (no header row with "Status" and "Commencement Date").');

    // Header names, expanding colspans and de-duplicating.
    const headers = [], seen = {};
    for (const c of cellsOf(headerTr)) {
      const span = Math.max(1, parseInt(c.getAttribute('colspan') || '1', 10));
      for (let i = 0; i < span; i++) {
        let name = norm(c.textContent) || 'Column ' + (headers.length + 1);
        if (seen[name]) name = name + ' (' + (++seen[name]) + ')'; else seen[name] = 1;
        headers.push(name);
      }
    }

    const table = headerTr.closest('table');
    const all = [...table.rows];
    const rows = [];
    for (const tr of all.slice(all.indexOf(headerTr) + 1)) {
      const vals = [];
      for (const c of cellsOf(tr)) {
        const span = Math.max(1, parseInt(c.getAttribute('colspan') || '1', 10));
        vals.push(norm(c.textContent)); for (let i = 1; i < span; i++) vals.push('');
      }
      if (vals.length < Math.ceil(headers.length * 0.6) || vals.every(v => !v)) continue;
      const row = {};
      headers.forEach((h, i) => { row[h] = vals[i] ?? ''; });
      const hidden = tr.querySelector('input[name^="policyStr"]');
      const m = (hidden && hidden.value.match(/\d{6,}/)) || norm(tr.textContent).match(/\b\d{8,12}\b/);
      row._policyNo = m ? m[0] : '';
      rows.push(row);
    }
    if (!rows.length) throw new Error('PARSE: found the table header but no policy rows.');

    // Make sure there is a Policy No column up front.
    const hasPolicyCol = headers.some(h => /policy\s*(no|number)/i.test(h));
    if (!hasPolicyCol) { headers.unshift('Policy No'); rows.forEach(r => { r['Policy No'] = r._policyNo; }); }
    return { headers, rows };
  }

  function ingest(html, source) {
    let parsed;
    try { parsed = parsePolicyList(html); }
    catch (e) { showDiag(html, e.message); throw new Error('ePartner\'s page layout wasn\'t recognised. Details are shown at the bottom of this page.'); }
    data = { fetchedAt: new Date().toISOString(), source, ...parsed };
    save(); render();
    flash('Loaded ' + data.rows.length + ' policies.', 'ok');
  }

  function showDiag(html, reason) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const ths = [...doc.querySelectorAll('tr')].slice(0, 400)
      .map(tr => cellsOf(tr).map(c => norm(c.textContent).slice(0, 25)).filter(Boolean).join(' | '))
      .filter(s => /status|date|policy/i.test(s)).slice(0, 8);
    const d = $('diag');
    d.style.display = 'block';
    d.textContent = 'Diagnostics (no client data shown)\nReason: ' + reason +
      '\nPage title: ' + norm(doc.title) + '\nTables: ' + doc.querySelectorAll('table').length +
      ' · Rows: ' + doc.querySelectorAll('tr').length +
      '\nHeader-like rows:\n  ' + (ths.join('\n  ').replace(/\b\d{6,}\b/g, '#####') || '(none)');
  }

  // ---- Persistence --------------------------------------------------------
  function save() {
    const area = $('keep').value === 'session' ? 'sessionStorage' : 'localStorage';
    const other = area === 'localStorage' ? 'sessionStorage' : 'localStorage';
    store.del(other, DATA_KEY);
    if (!store.set(area, DATA_KEY, JSON.stringify(data))) flash('Loaded, but this browser would not save it; it will be gone when you leave the page.', 'info');
  }
  function loadSaved() {
    const raw = store.get('sessionStorage', DATA_KEY) || store.get('localStorage', DATA_KEY);
    if (!raw) return;
    try { data = JSON.parse(raw); } catch { data = null; }
  }

  // ---- Value helpers ------------------------------------------------------
  const MONTHS = { jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, oct:9, nov:10, dec:11 };
  function parseDate(s) {
    s = norm(s); let m;
    if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/))) return new Date(+m[3], +m[2] - 1, +m[1]);
    if ((m = s.match(/^(\d{1,2})[\s\-\/]([A-Za-z]{3})[A-Za-z]*[\s\-\/,]+(\d{4})$/)) && MONTHS[m[2].toLowerCase()] !== undefined) return new Date(+m[3], MONTHS[m[2].toLowerCase()], +m[1]);
    if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/))) return new Date(+m[1], +m[2] - 1, +m[3]);
    return null;
  }
  function parseNum(s) {
    const t = norm(s).replace(/^(rm|myr)\s*/i, '').replace(/,/g, '');
    return /^-?\d+(\.\d+)?$/.test(t) ? parseFloat(t) : null;
  }
  const isDateCol = h => /date/i.test(h);
  const isNumCol = h => /amount|premium|sum|value|\(rm\)/i.test(h) && !/date|mode|method|type/i.test(h);
  const statusCol = () => data.headers.find(h => /^status$/i.test(h));
  const dueCol = () => data.headers.find(h => /premium due date/i.test(h)) || data.headers.find(h => /due date/i.test(h));
  const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };

  const inForce = row => { const sc = statusCol(); return !sc || /^in\s*force/i.test(row[sc] || ''); };
  const groupOf = s => norm(String(s || '').split('(')[0]) || '(blank)';
  const matchStatus = r => {
    if (!view.status) return true;
    const sc = statusCol(); if (!sc) return true;
    return view.status.startsWith('g:') ? groupOf(r[sc]).toLowerCase() === view.status.slice(2).toLowerCase() : r[sc] === view.status;
  };

  function dueState(row) {
    const c = dueCol(); if (!c || !inForce(row)) return '';
    const d = parseDate(row[c]); if (!d) return '';
    const diff = (d - today()) / 864e5;
    if (diff < 0) return 'overdue';
    if (diff <= DUE_SOON_DAYS) return 'soon';
    return '';
  }

  function hiddenCols() {
    if (Array.isArray(view.hidden)) return new Set(view.hidden);
    const h = new Set(data.headers.filter(x => DEFAULT_HIDDEN.some(re => re.test(x))));
    data.headers.forEach(x => { if (data.rows.every(r => !r[x])) h.add(x); });
    return h;
  }

  function filtered() {
    const sc = statusCol(), q = view.q.toLowerCase();
    let rows = data.rows.filter(r =>
      matchStatus(r) &&
      (!view.due || dueState(r) === view.due) &&
      (!q || data.headers.some(h => String(r[h]).toLowerCase().includes(q))));
    if (view.sort) {
      const h = view.sort, dir = view.dir;
      const key = isDateCol(h) ? r => (parseDate(r[h]) || new Date(0)).getTime()
                : isNumCol(h) ? r => parseNum(r[h]) ?? -Infinity
                : r => String(r[h]).toLowerCase();
      rows = [...rows].sort((a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : 0) * dir; });
    }
    return rows;
  }

  const fmtRM = n => 'RM ' + n.toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---- Rendering ----------------------------------------------------------
  function render() {
    const el = $('content');
    if (!data) {
      $('sub').textContent = '';
      el.innerHTML = '<div class="tablewrap"><div class="empty">No data yet.<br>Log in to ePartner in another tab, enter your agent number above, then click <b>Update from ePartner</b>.</div></div>';
      return;
    }
    const when = new Date(data.fetchedAt);
    $('sub').textContent = 'Last updated ' + when.toLocaleString() + ' · ' + data.rows.length + ' policies · stored in this browser only';

    const rows = filtered(), sc = statusCol(), hid = hiddenCols();
    const cols = data.headers.filter(h => !hid.has(h));

    // Tiles
    const soon = data.rows.filter(r => dueState(r) === 'soon').length;
    const over = data.rows.filter(r => dueState(r) === 'overdue').length;
    const premCols = data.headers.filter(h => /premium amount/i.test(h));
    let tiles = `<div class="tile"><div class="k">Policies shown</div><div class="v">${rows.length}<span style="font-size:13px;color:var(--muted)"> / ${data.rows.length}</span></div></div>`;
    tiles += `<div class="tile"><div class="k">In force (shown)</div><div class="v" style="color:var(--ok)">${rows.filter(inForce).length}</div></div>`;
    for (const pc of premCols) {
      const sum = rows.filter(inForce).reduce((s, r) => s + (parseNum(r[pc]) || 0), 0);
      tiles += `<div class="tile"><div class="k">Total ${esc(pc)} · in force (shown)</div><div class="v">${fmtRM(sum)}</div></div>`;
    }
    if (dueCol()) {
      tiles += `<div class="tile click ${view.due === 'soon' ? 'active' : ''}" data-due="soon"><div class="k">In force · premium due ≤ ${DUE_SOON_DAYS} days</div><div class="v" style="color:var(--warn)">${soon}</div></div>`;
      tiles += `<div class="tile click ${view.due === 'overdue' ? 'active' : ''}" data-due="overdue"><div class="k">In force · due date passed</div><div class="v" style="color:var(--bad)">${over}</div></div>`;
    }

    // Status chips
    let chips = '';
    if (sc) {
      const counts = {}, groups = {};
      data.rows.forEach(r => {
        const s = r[sc] || '(blank)', g = groupOf(s);
        counts[s] = (counts[s] || 0) + 1;
        (groups[g] = groups[g] || { n: 0, subs: new Set() }).n++; groups[g].subs.add(s);
      });
      const chip = (val, label, n) => `<span class="chip ${view.status === val ? 'active' : ''}" data-status="${esc(val)}">${esc(label)} · ${n}</span>`;
      const order = ['inforce', 'waiting for validate', 'lapsed', 'terminated'];
      const gs = Object.entries(groups).sort((a, b) => {
        const ia = order.indexOf(a[0].toLowerCase()), ib = order.indexOf(b[0].toLowerCase());
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || b[1].n - a[1].n;
      });
      chips = `<div class="chips"><span class="chip ${!view.status ? 'active' : ''}" data-status="">All statuses · ${data.rows.length}</span>` +
        gs.map(([g, o]) => chip('g:' + g, g + ' (all)', o.n)).join('') + '</div>';
      // Sub-statuses of the selected group (or of every group when a single status is picked)
      const curGroup = view.status.startsWith('g:') ? view.status.slice(2).toLowerCase()
                     : view.status ? groupOf(view.status).toLowerCase() : '';
      if (curGroup) {
        const subs = Object.entries(counts).filter(([s]) => groupOf(s).toLowerCase() === curGroup).sort((a, b) => b[1] - a[1]);
        if (subs.length > 1) chips += '<div class="chips" style="margin-left:12px">' + subs.map(([s, n]) => chip(s, s, n)).join('') + '</div>';
      }
    }

    // Column picker
    const picker = data.headers.map(h => `<label><input type="checkbox" data-col="${esc(h)}" ${hid.has(h) ? '' : 'checked'}> ${esc(h)}</label>`).join('');

    const thead = cols.map(h => `<th data-sort="${esc(h)}">${esc(h)} <span class="arrow">${view.sort === h ? (view.dir > 0 ? '▲' : '▼') : ''}</span></th>`).join('');
    const tbody = rows.map(r => {
      const ds = dueState(r);
      return '<tr>' + cols.map(h => {
        const cls = [isNumCol(h) && parseNum(r[h]) !== null ? 'num' : '', h === dueCol() && ds ? (ds === 'soon' ? 'due-soon' : 'overdue') : ''].filter(Boolean).join(' ');
        return `<td${cls ? ` class="${cls}"` : ''}>${esc(r[h])}</td>`;
      }).join('') + '</tr>';
    }).join('');

    el.innerHTML = `
      <div class="tiles">${tiles}</div>
      ${chips}
      <div class="bar">
        <input type="search" id="q" placeholder="Search name, policy no, plan…" value="${esc(view.q)}" style="flex:1;min-width:200px">
        <details class="cols"><summary>Columns</summary><div>${picker}<p class="foot"><a href="#" id="colsReset">Reset to default</a></p></div></details>
        <button id="btnCsv">Export CSV</button>
      </div>
      <div class="tablewrap"><table><thead><tr>${thead}</tr></thead><tbody>${tbody || `<tr><td colspan="${cols.length}" class="empty">No policies match.</td></tr>`}</tbody></table></div>
      <p class="foot">Click a column header to sort. Source: ${esc(data.source)}.</p>`;

    // Wire up
    el.querySelectorAll('[data-due]').forEach(t => t.onclick = () => { view.due = view.due === t.dataset.due ? '' : t.dataset.due; render(); });
    el.querySelectorAll('[data-status]').forEach(c => c.onclick = () => { view.status = c.dataset.status; render(); });
    el.querySelectorAll('th[data-sort]').forEach(th => th.onclick = () => {
      const h = th.dataset.sort; view.dir = view.sort === h ? -view.dir : 1; view.sort = h; render();
    });
    const q = $('q');
    q.oninput = () => { view.q = q.value; const pos = q.selectionStart; render(); const n = $('q'); n.focus(); n.setSelectionRange(pos, pos); };
    el.querySelectorAll('[data-col]').forEach(cb => cb.onchange = () => {
      const set = hiddenCols(); cb.checked ? set.delete(cb.dataset.col) : set.add(cb.dataset.col);
      view.hidden = [...set]; store.set('localStorage', 'ep.hiddenCols', JSON.stringify(view.hidden));
      render(); el.querySelector('details.cols').open = true;
    });
    $('colsReset').onclick = e => { e.preventDefault(); view.hidden = null; store.del('localStorage', 'ep.hiddenCols'); render(); };
    $('btnCsv').onclick = () => exportCsv(rows, cols);
  }

  function exportCsv(rows, cols) {
    const cell = v => /[",\n]/.test(v) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v ?? '');
    const csv = [cols.map(cell).join(','), ...rows.map(r => cols.map(h => cell(r[h])).join(','))].join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' }));
    a.download = 'policies-' + new Date().toISOString().slice(0, 10) + '.csv';
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function flash(text, kind) {
    const m = $('msg'); m.textContent = text; m.className = 'show ' + kind;
  }

  // ---- Start (must stay at the very end, after everything above is defined)
  loadSaved();
  try { render(); }
  catch (e) {
    console.error(e);
    flash('Your saved data could not be shown, so it was cleared. Click Update to pull it again.', 'bad');
    store.del('localStorage', DATA_KEY); store.del('sessionStorage', DATA_KEY);
    data = null; render();
  }
})();
</script>
<script>
// ===== Tabs =====
(() => {
  const tabs = [...document.querySelectorAll('.tab')];
  const show = name => {
    tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.getElementById('tab-pol').hidden = name !== 'pol';
    document.getElementById('tab-dcms').hidden = name !== 'dcms';
    try { localStorage.setItem('ep.tab', name); } catch {}
  };
  tabs.forEach(t => t.addEventListener('click', () => show(t.dataset.tab)));
  let start = 'pol'; try { start = localStorage.getItem('ep.tab') || 'pol'; } catch {}
  show(start === 'dcms' ? 'dcms' : 'pol');
})();

// ===== DCMS Production =====
(() => {
  const EXT_ID = 'hejafgddnndcimepblniaffimbgmedgk';
  const DIR = '/ePartner3/web/jsp/dcms_online/';
  const FORM_PATH = DIR + 'Enquiry%20on%20Agent%20Production.jsp';
  const POST_PATH = DIR + 'processing.jsp';
  const DATA_KEY = 'ep.dcms.v1';
  const FALLBACK_VIEWS = [{ value: '3810138', label: 'Dc Rep Contest' }];
  const WANT = [{ cb: 'dV1', re: /contest/i }, { cb: 'dV2', re: /maint|promotion/i }];

  const $ = id => document.getElementById(id);
  const store = {
    get(a, k) { try { return window[a].getItem(k); } catch { return null; } },
    set(a, k, v) { try { window[a].setItem(k, v); return true; } catch { return false; } },
    del(a, k) { try { window[a].removeItem(k); } catch {} },
  };
  const norm = s => (s || '').replace(/[\s ]+/g, ' ').trim();
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const isoToDmy = iso => { const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };

  let data = null;
  let showZeroCols = false;

  // Default periods: 1 Jan this year → today
  const now = new Date();
  $('dStart').value = store.get('localStorage', 'ep.dStart') || `${now.getFullYear()}-01-01`;
  $('dEnd').value = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  $('dStart').addEventListener('change', e => store.set('localStorage', 'ep.dStart', e.target.value));

  try { data = JSON.parse(store.get('sessionStorage', DATA_KEY) || store.get('localStorage', DATA_KEY) || 'null'); } catch { data = null; }

  $('btnDcms').addEventListener('click', update);
  $('btnClear').addEventListener('click', () => {
    store.del('localStorage', DATA_KEY); store.del('sessionStorage', DATA_KEY);
    data = null; render(); flash('DCMS data cleared from this browser.', 'ok');
  });
  $('keep').addEventListener('change', () => { if (data) save(); });

  function ext(msg) {
    return new Promise((resolve, reject) => {
      if (!window.chrome || !chrome.runtime || !chrome.runtime.sendMessage) return reject(new Error('NO_EXTENSION'));
      try {
        chrome.runtime.sendMessage(EXT_ID, msg, res => {
          if (chrome.runtime.lastError) return reject(new Error('NO_EXTENSION'));
          resolve(res);
        });
      } catch { reject(new Error('NO_EXTENSION')); }
    });
  }
  async function get(path, opts = {}) {
    const res = await ext({ type: 'fetch', path, ...opts });
    if (!res || !res.ok) {
      const e = new Error((res && res.error) || 'ERROR');
      if (res && res.detail) e.detail = res.detail;
      throw e;
    }
    return res.html;
  }

  const ERR = {
    NO_EXTENSION: 'The ePartner Puller extension was not found. Use Chrome on the computer where it is installed.',
    NO_TAB: 'Open ePartner in another tab and log in, then click Update DCMS again.',
    LOGGED_OUT: 'Your ePartner session has expired. Log in again, then click Update DCMS.',
    NETWORK: 'Could not reach ePartner. Check your connection and that the ePartner tab is loaded.',
    OLD_EXT: 'Your ePartner Puller extension is the old version (it can’t reach DCMS yet). Replace the extension folder with the new zip and click Reload in chrome://extensions.',
    DCMS_ERROR: 'DCMS refused the request and showed its error page. Check the period dates, and that DCMS opens normally for you right now; details are at the bottom of this page.',
    NO_FORM: 'Could not open the DCMS form. In your ePartner tab, open DCMS Online Enquiry once (so ePartner logs you into DCMS), then click Update DCMS again.',
  };

  async function update() {
    const agentNo = $('agentNo').value.trim();
    if (!/^\d{4,12}$/.test(agentNo)) { flash('Enter your agent number at the top first.', 'bad'); $('agentNo').focus(); return; }
    if (!$('dStart').value || !$('dEnd').value) { flash('Choose a start and end period.', 'bad'); return; }
    if (!$('dV1').checked && !$('dV2').checked) { flash('Tick at least one view.', 'bad'); return; }
    const btn = $('btnDcms'); btn.disabled = true;
    try {
      const ping = await ext({ type: 'ping' });
      if (!ping || !ping.version || ping.version.localeCompare('1.1.0', undefined, { numeric: true }) < 0) throw new Error('OLD_EXT');

      flash('Opening the DCMS form…', 'info');
      const formHtml = await get(FORM_PATH);
      const form = readForm(formHtml);

      const picked = [];
      for (const w of WANT) {
        if (!$(w.cb).checked) continue;
        const opt = form.views.find(v => w.re.test(v.label)) || (w.cb === 'dV1' ? FALLBACK_VIEWS[0] : null);
        if (opt) picked.push(opt); else throw new Error('View "' + $(w.cb).parentElement.textContent.trim() + '" is not in the DCMS View list any more.');
      }

      const end = $('dEnd').value;
      const results = [];
      for (const [i, view] of picked.entries()) {
        flash(`Pulling ${view.label} (${i + 1} of ${picked.length})…`, 'info');
        const body = {
          ...form.defaults,
          destination: form.defaults.destination || 'EAP',   // tells DCMS which report to build
          agentNo,
          view_list: view.value,
          txtStartPeriodDate: isoToDmy($('dStart').value),
          txtEndPeriodDate: isoToDmy(end),
          hrchy_list: 'CUR_HRCHY',
          as_of_mth: String(+end.slice(5, 7)),
          as_of_year: end.slice(0, 4),
          Submit: 'Submit',
        };
        let html = await get(form.action, { method: 'POST', form: body, referrer: FORM_PATH });
        // ePartner shows a "PROCESSING DATA" page first, which forwards to the
        // real results page. Follow up to 4 hand-offs.
        let here = form.action.split('?')[0];
        for (let hop = 0; hop < 4 && !/Stat\s*Code/i.test(html); hop++) {
          const step = nextStep(html, here);
          if (!step) break;
          if (step.error) { showDiag(html, 'DCMS sent its error page.'); throw new Error('DCMS_ERROR'); }
          flash(`Pulling ${view.label} (${i + 1} of ${picked.length}): waiting for DCMS to finish processing…`, 'info');
          html = await get(step.path, { method: step.method, form: step.form, referrer: here });
          here = step.path.split('?')[0];
        }
        let parsed;
        try { parsed = parseDcms(html); }
        catch (e) { showDiag(html, e.message); throw new Error('The DCMS results layout wasn’t recognised for “' + view.label + '”. Details are at the bottom of this page.'); }
        results.push({ view: view.label, ...parsed });
      }

      data = { fetchedAt: new Date().toISOString(), agentNo, start: $('dStart').value, end, results };
      save(); render();
      flash('DCMS updated: ' + results.map(r => r.view).join(' and ') + '.', 'ok');
    } catch (err) {
      const code = err && err.message;
      flash((ERR[code] || (code && code.startsWith('HTTP_') ? 'ePartner returned an error (' + code.slice(5) + ').' : code || 'Something went wrong.')) + (err && err.detail ? ' (' + err.detail + ')' : ''), 'bad');
    } finally { btn.disabled = false; }
  }

  function readForm(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const sel = doc.querySelector('select[name="view_list"]');
    if (!sel) throw new Error('NO_FORM');
    const f = sel.closest('form');
    const defaults = {};
    if (f) {
      for (const el of f.querySelectorAll('input[name], select[name]')) {
        const t = (el.getAttribute('type') || '').toLowerCase();
        if (['submit', 'button', 'image', 'reset', 'file'].includes(t)) continue;
        if ((t === 'checkbox' || t === 'radio') && !el.hasAttribute('checked')) continue;
        if (el.tagName === 'SELECT') {
          const o = el.querySelector('option[selected]') || el.querySelector('option');
          defaults[el.name] = o ? (o.getAttribute('value') ?? o.textContent.trim()) : '';
        } else defaults[el.name] = el.getAttribute('value') || '';
      }
    }
    let action = POST_PATH;
    const a = f && f.getAttribute('action');
    if (a && !/^\s*javascript:/i.test(a)) {
      try { const u = new URL(a, 'https://x' + FORM_PATH); if (u.pathname.startsWith('/ePartner3/')) action = u.pathname + u.search; } catch {}
    }
    const views = [...sel.options].map(o => ({ value: o.getAttribute('value') ?? o.textContent.trim(), label: norm(o.textContent) })).filter(v => v.value);
    return { defaults, action, views };
  }

  // Work out where a hand-off page sends the browser next.
  function resolveDcms(u, base) {
    try {
      const url = new URL(u, 'https://x' + base);
      if (!url.pathname.startsWith('/ePartner3/') || /logout|logoff/i.test(url.pathname)) return null;
      return url.pathname + url.search;
    } catch { return null; }
  }
  function formFields(f) {
    const out = {};
    for (const el of f.querySelectorAll('input[name], select[name], textarea[name]')) {
      const t = (el.getAttribute('type') || '').toLowerCase();
      if (['button', 'image', 'reset', 'file'].includes(t)) continue;
      if ((t === 'checkbox' || t === 'radio') && !el.hasAttribute('checked')) continue;
      if (el.tagName === 'SELECT') {
        const o = el.querySelector('option[selected]') || el.querySelector('option');
        out[el.name] = o ? (o.getAttribute('value') ?? o.textContent.trim()) : '';
      } else if (el.tagName === 'TEXTAREA') out[el.name] = el.textContent;
      else out[el.name] = el.getAttribute('value') || '';
    }
    return out;
  }
  function nextStep(html, base) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const js = ([...doc.scripts].map(x => x.textContent).join('\n') + '\n' +
      [...doc.querySelectorAll('[onload]')].map(x => x.getAttribute('onload')).join('\n'))
      .replace(/["']\s*\+\s*["']/g, '');               // join "/ePartner3"+"/web/..." pieces
    const jsNoFns = js.replace(/function\s+confirmLogout[\s\S]*?\n\}/g, '');

    // 1) A form that the page submits by itself
    if (/\.submit\s*\(/.test(jsNoFns)) {
      const forms = [...doc.forms];
      const named = forms.find(f => {
        const n = f.getAttribute('name') || f.getAttribute('id');
        return n && new RegExp('(forms\\[\\s*["\']?' + n + '["\']?\\s*\\]|document\\.' + n + '|getElementById\\(\\s*["\']' + n + '["\']\\s*\\))[^;\\n]*\\.submit').test(jsNoFns);
      });
      const f = named || forms.find(f => !/processing\.jsp/i.test(f.getAttribute('action') || '')) || forms[0];
      if (f) {
        let action = f.getAttribute('action') || '';
        const setAct = jsNoFns.match(/\.action\s*=\s*["']([^"']+)["']/);
        if (setAct) action = setAct[1];
        else if (/\.action\s*=\s*[A-Za-z_$][\w$]*/.test(jsNoFns)) {
          // e.g. <body onload="scroll(0,'Result.jsp')"> + form.action = destination
          const onl = [...doc.querySelectorAll('[onload]')].map(x => x.getAttribute('onload')).join(' ');
          const m = (onl + '\n' + jsNoFns).match(/["']([^"'()<>+]+?\.(?:jsp|do|html?)(?:\?[^"']*)?)["']/i);
          if (m) action = m[1];
        }
        if (/(^|\/)error\.jsp/i.test(action)) return { error: true };
        if (!action.trim()) return null;   // don't re-post to the same page
        const path = resolveDcms(action || base, base);
        if (path) return { path, method: (f.getAttribute('method') || 'GET').toUpperCase() === 'POST' ? 'POST' : 'GET', form: formFields(f) };
      }
    }
    // 2) A script redirect to a fixed address
    const loc = jsNoFns.match(/(?:location(?:\.href)?\s*=|location\.(?:replace|assign)\s*\(|window\.open\s*\()\s*["']([^"']+)["']/);
    if (loc) { const path = resolveDcms(loc[1], base); if (path) return { path, method: 'GET' }; }
    // 3) <meta http-equiv="refresh">
    const meta = doc.querySelector('meta[http-equiv="refresh" i]');
    const mu = meta && (meta.getAttribute('content') || '').match(/url\s*=\s*['"]?([^'";]+)/i);
    if (mu) { const path = resolveDcms(mu[1], base); if (path) return { path, method: 'GET' }; }
    return null;
  }

  // ---- Parse the results (plain-text report or table) ----
  const NUM = /^\(?-?[\d,]*\.?\d+\)?$/;
  const toNum = s => { const neg = /^\(.*\)$/.test(s) || s.startsWith('-'); const n = parseFloat(s.replace(/[(),\-]/g, '')); return neg ? -n : n; };

  function parseDcms(html) {
    const doc = new DOMParser().parseFromString(html.replace(/<br\s*\/?>/gi, '\n').replace(/<\/(div|p|tr|table|pre|center|h\d)>/gi, '\n$&'), 'text/html');

    // A) Real table with a "Stat Code" header cell
    for (const tr of doc.querySelectorAll('tr')) {
      const cells = [...tr.children].filter(c => /^T[DH]$/.test(c.tagName)).map(c => norm(c.textContent));
      const si = cells.findIndex(c => /^stat\s*code$/i.test(c));
      if (si < 0) continue;
      const cols = cells.slice(si + 1).filter(Boolean);
      const rows = []; let block = '';
      const all = [...tr.closest('table').rows];
      for (const r of all.slice(all.indexOf(tr) + 1)) {
        const v = [...r.children].filter(c => /^T[DH]$/.test(c.tagName)).map(c => norm(c.textContent));
        const ci = v.findIndex((x, i) => /^[A-Z][A-Z0-9_]*$/.test(x) && v.slice(i + 1).filter(Boolean).every(y => NUM.test(y)) && v.slice(i + 1).some(Boolean));
        if (ci < 0) continue;
        const left = v.slice(0, ci).filter(Boolean).join(' ');
        if (left) block = left;
        rows.push({ block, code: v[ci], values: v.slice(ci + 1).filter(Boolean).map(toNum) });
      }
      if (rows.length) return { profile: profileFrom(doc.body.textContent), cols, rows };
    }

    // B) Plain-text report (what the screen looks like)
    const text = (doc.body ? doc.body.textContent : '').replace(/\r/g, '').replace(/ /g, ' ');
    const lines = text.split('\n');
    const hi = lines.findIndex(l => /\bStat Code\b/.test(l) && /\S\s{2,}\S/.test(l));
    if (hi < 0) throw new Error('No "Stat Code" heading found in the DCMS results.');
    const head = lines[hi].split(/\s{2,}|\t/).map(norm).filter(Boolean);
    const cols = head.slice(head.findIndex(h => /^stat code$/i.test(h)) + 1);

    const rows = []; let blockParts = [], lastWasData = false;
    for (const line of lines.slice(hi + 1)) {
      const t = line.trim().split(/\s+/).filter(Boolean);
      if (!t.length) continue;
      const ci = t.findIndex((x, i) => /^[A-Z][A-Z0-9_]*$/.test(x) && i < t.length - 1 && t.slice(i + 1).every(y => NUM.test(y)));
      if (ci < 0) {
        // A line with only left-hand info (e.g. dates under the position)
        if (t.every(x => /^\d{1,2}-[A-Za-z]{3}-\d{4}$/.test(x) || /^[A-Z]{2,5}$/.test(x)) && t.length <= 3) { blockParts.push(t.join(' ')); continue; }
        if (rows.length && /[A-Za-z]{4,}/.test(line) && !NUM.test(t[0])) { if (rows.length > 3) break; }
        continue;
      }
      const left = t.slice(0, ci);
      if (left.length) {
        const isNewPos = left.some(x => !/^\d{1,2}-[A-Za-z]{3}-\d{4}$/.test(x));
        if (isNewPos && lastWasData) blockParts = [];
        blockParts.push(left.join(' '));
      }
      rows.push({ block: blockParts.join(' · '), code: t[ci], values: t.slice(ci + 1).map(toNum) });
      lastWasData = true;
    }
    if (!rows.length) throw new Error('Found the "Stat Code" heading but no figures under it.');
    // Fix block labels so every row of a position shows the full label
    const fullLabel = {}; rows.forEach(r => { const k = r.block.split(' · ')[0]; if ((fullLabel[k] || '').length < r.block.length) fullLabel[k] = r.block; });
    rows.forEach(r => { r.block = fullLabel[r.block.split(' · ')[0]] || r.block; });
    return { profile: profileFrom(lines.slice(Math.max(0, hi - 14), hi).join('\n')), cols, rows };
  }

  function profileFrom(text) {
    const out = [];
    for (const line of String(text).split('\n')) {
      const re = /([A-Za-z][A-Za-z .]{1,30}?)\s*:\s+(.+?)(?=\s{2,}[A-Za-z][A-Za-z .]{1,30}?\s*:\s|$)/g;
      let m;
      while ((m = re.exec(line.trim()))) {
        const k = norm(m[1]), v = norm(m[2]);
        if (!v || /^id\b/i.test(k) || /\d{6}-\d{2}-\d{4}/.test(v)) continue; // never keep IC numbers
        if (/^(agent no|view|hrchy type|start period|end period|as of year)$/i.test(k) && out.some(o => o.k === k)) continue;
        out.push({ k, v });
      }
    }
    return out.slice(0, 10);
  }

  function showDiag(html, reason) {
    const doc = new DOMParser().parseFromString(html.replace(/<br\s*\/?>/gi, '\n').replace(/<\/(div|p|tr|table|pre|center|h\d)>/gi, '\n$&'), 'text/html');
    const text = (doc.body ? doc.body.textContent : '').replace(/ /g, ' ');
    const i = text.search(/Stat\s*Code/i);
    const snippet = (i >= 0 ? text.slice(Math.max(0, i - 300), i + 900) : text.slice(0, 1200))
      .replace(/\d{6}-\d{2}-\d{4}/g, '######-##-####').replace(/\n\s*\n+/g, '\n');
    const mask = t => String(t).replace(/\d{6}-\d{2}-\d{4}/g, '######-##-####');
    const forms = [...doc.forms].map(f => '  <form name=' + (f.getAttribute('name') || '') + ' action=' + (f.getAttribute('action') || '') +
      ' method=' + (f.getAttribute('method') || '') + '> fields: ' + [...f.querySelectorAll('[name]')].map(e => e.getAttribute('name')).join(', ')).join('\n');
    const scripts = [...doc.scripts].map(x => x.textContent.trim()).filter(t => t && !/confirmLogout|gtag|dataLayer|GoogleAnalytics/i.test(t))
      .map(t => mask(t.slice(0, 700))).join('\n  ---\n');
    const metas = [...doc.querySelectorAll('meta[http-equiv]')].map(m => m.outerHTML).join(' ');
    const onload = [...doc.querySelectorAll('[onload]')].map(x => x.getAttribute('onload')).join(' | ');
    const extra = '\n\nForms:\n' + (forms || '  (none)') + '\nonload: ' + (onload || '(none)') + '\nmeta: ' + (metas || '(none)') +
      '\nScripts:\n  ' + (scripts || '(none)');
    const d = $('ddiag'); d.style.display = 'block';
    d.textContent = 'DCMS diagnostics (IC numbers masked)\nReason: ' + reason + '\nTitle: ' + norm(doc.title) +
      ' · Tables: ' + doc.querySelectorAll('table').length + ' · <pre>: ' + doc.querySelectorAll('pre').length + '\n---\n' + snippet.slice(-600) + extra;
  }

  function save() {
    const area = $('keep').value === 'session' ? 'sessionStorage' : 'localStorage';
    store.del(area === 'localStorage' ? 'sessionStorage' : 'localStorage', DATA_KEY);
    store.set(area, DATA_KEY, JSON.stringify(data));
  }

  function flash(text, kind) { const m = $('dmsg'); m.textContent = text; m.className = 'show ' + kind; }

  const fmt = n => n.toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const dmy = iso => iso ? isoToDmy(iso) : '';

  function render() {
    const el = $('dcontent');
    if (!data) {
      $('dsub').textContent = '';
      el.innerHTML = '<div class="tablewrap"><div class="empty">No DCMS data yet.<br>Log in to ePartner in another tab, choose the period above, then click <b>Update DCMS</b>.</div></div>';
      return;
    }
    $('dsub').textContent = 'Last updated ' + new Date(data.fetchedAt).toLocaleString() + ' · period ' + dmy(data.start) + ' – ' + dmy(data.end) + ' · stored in this browser only';
    let html = `<div class="bar"><label><input type="checkbox" id="dZero" ${showZeroCols ? 'checked' : ''}> Show columns that are all zero</label><span class="spacer"></span><button id="dCsv">Export CSV</button></div>`;
    const profile = (data.results[0] && data.results[0].profile) || [];
    if (profile.length) html += `<div class="kv">${profile.map(p => `<span>${esc(p.k)}: <b>${esc(p.v)}</b></span>`).join('')}</div>`;

    for (const r of data.results) {
      const n = Math.max(r.cols.length, ...r.rows.map(x => x.values.length));
      const names = Array.from({ length: n }, (_, i) => r.cols[i] || 'Col ' + (i + 1));
      const keep = names.map((_, i) => showZeroCols || r.rows.some(x => (x.values[i] || 0) !== 0));
      const hasBlocks = new Set(r.rows.map(x => x.block)).size > 1 || r.rows.some(x => x.block);
      let prev = null;
      const body = r.rows.map(x => {
        const first = x.block !== prev; prev = x.block;
        return `<tr class="${first ? 'group-start' : ''}">${hasBlocks ? `<td class="block">${first ? esc(x.block) : ''}</td>` : ''}<td><b>${esc(x.code)}</b></td>` +
          names.map((_, i) => keep[i] ? `<td class="num ${!x.values[i] ? 'zero' : ''}">${x.values[i] === undefined ? '' : fmt(x.values[i])}</td>` : '').join('') + '</tr>';
      }).join('');
      html += `<div class="card"><h2>${esc(r.view)}</h2><div class="tablewrap" style="max-height:none"><table><thead><tr>${hasBlocks ? '<th>Position</th>' : ''}<th>Stat Code</th>${names.map((h, i) => keep[i] ? `<th style="text-align:right">${esc(h)}</th>` : '').join('')}</tr></thead><tbody>${body}</tbody></table></div>
        ${keep.some(k => !k) ? `<p class="foot">${keep.filter(k => !k).length} all-zero column(s) hidden.</p>` : ''}</div>`;
    }
    el.innerHTML = html;
    $('dZero').onchange = e => { showZeroCols = e.target.checked; render(); };
    $('dCsv').onclick = exportCsv;
  }

  function exportCsv() {
    const cell = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v ?? '');
    const out = [];
    for (const r of data.results) {
      out.push(['View', 'Position', 'Stat Code', ...r.cols].map(cell).join(','));
      r.rows.forEach(x => out.push([r.view, x.block, x.code, ...x.values].map(cell).join(',')));
      out.push('');
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + out.join('\r\n')], { type: 'text/csv' }));
    a.download = 'dcms-' + data.end + '.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  try { render(); } catch (e) { console.error(e); data = null; store.del('localStorage', DATA_KEY); store.del('sessionStorage', DATA_KEY); render(); }
})();
</script>
</body>
</html>
